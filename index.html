<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BlueCircuit — Gestão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#EFF6FF',
              100: '#DBEAFE',
              200: '#BFDBFE',
              300: '#93C5FD',
              400: '#60A5FA',
              500: '#2563EB',
              600: '#1D4ED8',
              700: '#1E3A5F',
              800: '#172E50',
              900: '#0F2140',
            },
            destaque: '#10B981',
            destaqueHover: '#059669',
            superfice: '#F8FAFC',
            superficieEscura: '#E2E8F0',
          },
          fontFamily: {
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
            body: ['"DM Sans"', 'sans-serif'],
          },
          boxShadow: {
            'sm-base': '0 1px 2px rgba(30,58,95,0.06)',
            'card': '0 2px 8px rgba(30,58,95,0.08), 0 1px 3px rgba(30,58,95,0.06)',
            'card-hover': '0 8px 24px rgba(30,58,95,0.12), 0 2px 8px rgba(30,58,95,0.08)',
            'elevated': '0 12px 40px rgba(30,58,95,0.16), 0 4px 12px rgba(30,58,95,0.10)',
            'nav': '0 -2px 20px rgba(30,58,95,0.08)',
            'btn': '0 2px 8px rgba(37,99,235,0.3)',
            'btn-active': '0 1px 3px rgba(37,99,235,0.4)',
          },
          borderRadius: {
            '2xl': '1rem',
            '3xl': '1.25rem',
          }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { overscroll-behavior: none; }
    body { font-family: 'DM Sans', sans-serif; background: #0F172A; }

    /* Animação de entrada das telas */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    [data-tela] { animation: fadeSlideIn .32s ease-out both; }
    [data-tela].hidden { animation: none; }

    /* Botão ativo na navegação */
    .nav-btn { transition: color .2s ease, background .2s ease; }
    .nav-btn.ativo { color: #2563EB; background: #EFF6FF; }
    .nav-btn.ativo svg { stroke: #2563EB; }
    .nav-btn:not(.ativo) { color: #94A3B8; }
    .nav-btn:not(.ativo) svg { stroke: #94A3B8; }

    /* Scrollbar discreta */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

    /* Foco visível para acessibilidade */
    *:focus-visible { outline: 2px solid #2563EB; outline-offset: 2px; border-radius: 6px; }

    /* Classes utilitárias reutilizáveis */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 9999px; font-size: 12px;
      font-weight: 600; letter-spacing: .01em; font-family: 'DM Sans', sans-serif;
    }
    .badge-verde  { background: #ECFDF5; color: #059669; }
    .badge-azul   { background: #EFF6FF; color: #2563EB; }
    .badge-laranja { background: #FFF7ED; color: #C2410C; }
    .badge-roxo   { background: #F5F3FF; color: #7C3AED; }
    .badge-cinza  { background: #F1F5F9; color: #64748B; }

    .card {
      background: #fff; border-radius: 1rem; padding: 16px;
      box-shadow: 0 2px 8px rgba(30,58,95,0.08), 0 1px 3px rgba(30,58,95,0.06);
      transition: box-shadow .2s ease, transform .15s ease;
    }
    .card:active { transform: scale(.985); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: .75rem; font-weight: 600; font-size: 14px;
      font-family: 'DM Sans', sans-serif; border: none; cursor: pointer;
      transition: background .18s ease, box-shadow .18s ease, transform .1s ease;
    }
    .btn:active { transform: scale(.97); }
    .btn-primario { background: #2563EB; color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.3); }
    .btn-primario:hover { background: #1D4ED8; }
    .btn-secundario { background: #F1F5F9; color: #1E3A5F; }
    .btn-secundario:hover { background: #E2E8F0; }
    .btn-perigo { background: #FEE2E2; color: #DC2626; }
    .btn-perigo:hover { background: #FECACA; }

    /* Toast */
    @keyframes toastIn  { from { opacity: 0; transform: translateY(-16px) scale(.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-16px) scale(.95); } }
    .toast-entrando { animation: toastIn .28s ease-out both; }
    .toast-saindo   { animation: toastOut .25s ease-in both; }

    /* Modal overlay */
    .modal-overlay { background: rgba(15,23,42,.55); backdrop-filter: blur(3px); }
    .modal-carta   { animation: fadeSlideIn .25s ease-out both; }

    /* Moldura do celular em telas grandes */
    @media (min-width: 450px) {
      #moldura-app {
        max-width: 390px; height: 844px; border-radius: 36px;
        border: 6px solid #1E293B; overflow: hidden;
        box-shadow: 0 0 0 3px #0F172A, 0 25px 80px rgba(0,0,0,.5);
        display: flex; flex-direction: column; position: relative;
      }
    }
    @media (max-width: 449px) {
      #moldura-app { display: flex; flex-direction: column; height: 100dvh; }
    }
  </style>
</head>

<body class="bg-slate-900 flex items-center justify-center min-h-screen">

  <!-- ======= MOLDA DO APP ======= -->
  <div id="moldura-app" class="bg-superfice w-full">

    <!-- Barra de status (apenas desktop) -->
    <div class="hidden min-[450px]:flex items-center justify-between px-7 pt-3 pb-1 bg-white shrink-0">
      <span id="relogio" class="text-xs font-semibold text-marca-700 font-display">12:00</span>
      <div class="flex items-center gap-1.5">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 8h2v3H1zM5 5h2v6H5zM9 3h2v8H9zM13 1h2v10h-2z" fill="#1E3A5F" opacity=".35"/><path d="M1 9h1v2H1zM5 6h1v5H5zM9 4h1v7H9zM13 2h1v9h-1z" fill="#1E3A5F"/></svg>
        <svg width="14" height="11" viewBox="0 0 14 11" fill="none"><rect x=".5" y=".5" width="10" height="10" rx="2.5" stroke="#1E3A5F" opacity=".4"/><rect x="10.5" y="3.5" width="2.5" height="4" rx=".5" fill="#1E3A5F" opacity=".35"/><rect x="2" y="2" width="7" height="7" rx="1.5" fill="#1E3A5F"/></svg>
      </div>
    </div>

    <!-- ======= ÁREA DE TELAS ======= -->
    <main id="conteudo" class="flex-1 overflow-y-auto bg-superfice pb-4 min-[450px]:pb-0">

      <!-- TELAS -->

    </main>

    <!-- ======= NAVEGAÇÃO INFERIOR ======= -->
    <nav class="shrink-0 bg-white border-t border-slate-100 shadow-nav safe-area-bottom">
      <div class="flex items-center justify-around py-1.5 px-1 max-w-[390px] mx-auto">

        <button data-nav="painel" onclick="mostrarTela('painel')" class="nav-btn ativo flex flex-col items-center gap-0.5 py-1.5 px-2 rounded-xl" aria-label="Painel">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span class="text-[10px] font-semibold leading-none">Painel</span>
        </button>

        <button data-nav="nova-rota" onclick="mostrarTela('nova-rota')" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 px-2 rounded-xl" aria-label="Nova Rota">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span class="text-[10px] font-semibold leading-none">Rota</span>
        </button>

        <button data-nav="clientes" onclick="mostrarTela('clientes')" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 px-2 rounded-xl" aria-label="Clientes">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="text-[10px] font-semibold leading-none">Clientes</span>
        </button>

        <button data-nav="recebimento" onclick="mostrarTela('recebimento')" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 px-2 rounded-xl" aria-label="Recebimento">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          <span class="text-[10px] font-semibold leading-none">Recebim.</span>
        </button>

        <button data-nav="despesas" onclick="mostrarTela('despesas')" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 px-2 rounded-xl" aria-label="Despesas">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          <span class="text-[10px] font-semibold leading-none">Despesas</span>
        </button>

        <button data-nav="relatorios" onclick="mostrarTela('relatorios')" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 px-2 rounded-xl" aria-label="Relatórios">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
          <span class="text-[10px] font-semibold leading-none">Relatórios</span>
        </button>

        <button data-nav="perfil" onclick="mostrarTela('perfil')" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 px-2 rounded-xl" aria-label="Perfil">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="text-[10px] font-semibold leading-none">Perfil</span>
        </button>

      </div>
    </nav>
  </div>

  <!-- ======= TOASTS ======= -->
  <div id="toasts" class="fixed top-4 left-1/2 -translate-x-1/2 z-[999] flex flex-col gap-2 pointer-events-none min-[450px]:left-[calc(50%-195px)]" style="width:min(390px,calc(100vw-32px))"></div>

  <!-- ======= MODAL GENÉRICO ======= -->
  <div id="modal-overlay" class="modal-overlay fixed inset-0 z-[998] hidden items-center justify-center p-6" onclick="fecharModal(event)">
    <div id="modal-carta" class="modal-carta bg-white rounded-3xl w-full max-w-sm shadow-elevated max-h-[80vh] flex flex-col" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between p-5 pb-3">
        <h3 id="modal-titulo" class="font-display font-700 text-marca-700 text-lg leading-tight"></h3>
        <button onclick="fecharModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 transition-colors" aria-label="Fechar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-corpo" class="px-5 pb-5 overflow-y-auto"></div>
    </div>
  </div>

  <!-- ======= UTILITÁRIOS ======= -->
  <script>
    /* Formata valor para Real brasileiro */
    function brl(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    /* Converte ISO (YYYY-MM-DD) para dd/mm/aaaa */
    function dataBR(iso) {
      if (!iso) return '—';
      var p = iso.split('-');
      return p[2] + '/' + p[1] + '/' + p[0];
    }

    /* Relógio da barra de status */
    (function atualizarRelogio() {
      var el = document.getElementById('relogio');
      if (!el) return;
      function tick() {
        var d = new Date();
        el.textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      }
      tick();
      setInterval(tick, 30000);
    })();

    /* Toast */
    function toast(mensagem, tipo) {
      var container = document.getElementById('toasts');
      var cores = { ok: 'bg-emerald-600', erro: 'bg-red-600', info: 'bg-marca-500' };
      var icones = {
        ok:    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>',
        erro:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        info:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
      };
      var div = document.createElement('div');
      div.className = 'toast-entrando pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-elevated text-white text-sm font-medium font-body';
      var cor = cores[tipo] || cores.info;
      div.classList.add(cor);
      div.innerHTML = icones[tipo] + '<span>' + mensagem + '</span>';
      container.appendChild(div);
      setTimeout(function() {
        div.classList.remove('toast-entrando');
        div.classList.add('toast-saindo');
        div.addEventListener('animationend', function() { div.remove(); });
      }, 3000);
    }

    /* Modal */
    function abrirModal(html, titulo) {
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-corpo').innerHTML = html;
      var overlay = document.getElementById('modal-overlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }
    function fecharModal(e) {
      if (e && e.target !== e.currentTarget) return;
      var overlay = document.getElementById('modal-overlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharModal();
    });
  </script>

  <!-- ======= ROTEADOR ======= -->
  <script>
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }
    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('painel');
    });
  </script>

</body>
</html>
